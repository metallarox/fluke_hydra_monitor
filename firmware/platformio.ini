; PlatformIO build (alternative to the Arduino IDE)
[platformio]
src_dir = hydra_web

[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200

; Wemos D1 mini (4 MB) instead of the Pro:
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
