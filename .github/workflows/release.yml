# Publishes a GitHub Release with the ready-to-use files when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} · Desktop · Hydra Web · GPIB plate
          body_path: RELEASE_NOTES.md
          files: |
            fluke_hydra_monitor.py
            firmware/bin/*.bin
            hardware/gpib_plate/hydra_wemos_plate.stl
            hardware/gpib_plate/hydra_wemos_plate_cover.stl
            hardware/gpib_plate/hydra_wemos_plate.step
            hardware/gpib_plate/hydra_wemos_plate.FCMacro
